name: Build and Push Multiarch Docker Image

on:
  push:
    branches:
      - '**'

jobs:
  development:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup QEMU
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Create Docker Buildx Builder
        run: |
          export DOCKER_CLI_EXPERIMENTAL=enabled
          docker context create multi-arch-build || true
          docker buildx create --use multi-arch-build

      - name: Login to GitLab Container Registry
        env:
          GITLAB_CI_BOT_SECRET: ${{ secrets.GITLAB_CI_BOT_SECRET }}
        run: |
          echo "$GITLAB_CI_BOT_SECRET" | docker login registry.gitlab.com -u sonaproject --password-stdin

      - name: Resolve image tag
        id: image_tag
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          SAFE_TAG="$(echo "${RAW_TAG}" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')"
          SAFE_TAG="$(echo "${SAFE_TAG}" | sed -e 's/^-*//' -e 's/-*$//')"

          if [[ -z "${SAFE_TAG}" ]]; then
            SAFE_TAG="${GITHUB_SHA::12}"
          fi

          # Keep the legacy release tag for the main release branch.
          if [[ "${GITHUB_REF}" == "refs/heads/3.4.1-master" ]]; then
            SAFE_TAG="v3.4.1-infra-master"
          fi

          echo "tag=${SAFE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Resolved image tag: ${SAFE_TAG}"

      - name: Build multiarch docker image and push
        env:
          TAG: ${{ steps.image_tag.outputs.tag }}
        run: ./hack/docker_build_multiarch.sh
