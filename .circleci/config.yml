version: 2.1
commands:
  setup:
    steps:
      - checkout
      - run:
          name: setup Qemu
          command: |
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - run:
          name: Create builder
          command: |
            export DOCKER_CLI_EXPERIMENTAL=enabled
            docker context create multi-arch-build
            docker buildx create --use multi-arch-build
            
jobs:
  "development":
    machine:
      image: ubuntu-2004:202010-01
    steps:
      - setup
      - run:
          name: Login to the gitlab
          command: |
            docker login registry.gitlab.com -u sonaproject -p glpat-ZsJXSZZuufyAm59kSXGn
      - run:
          name: Build multiarch docker image and push
          command: |
            if [ "${CIRCLE_BRANCH}" == "3.4.0" ]; then
              ./hack/docker_build_multiarch.sh
            fi

workflows:
  version: 2.1
  build:
    jobs:
      - "development"
